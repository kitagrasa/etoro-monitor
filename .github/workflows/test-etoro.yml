name: Diagnóstico eToro

# Comprueba, desde un runner de GitHub, si los endpoints públicos de eToro
# responden. Útil si el monitor deja de avisar: así ves si es un problema
# de eToro (bloqueo, cambio de API) o de tu configuración.
on:
  workflow_dispatch:
    inputs:
      usuario:
        description: "Usuario de eToro a consultar (el de /people/<usuario>)"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ping a los endpoints públicos
        env:
          LOG_LEVEL: INFO
        run: python -m etoro_monitor ping --username "${{ inputs.usuario }}"

      - name: Resolver usuario -> CID
        run: python -m etoro_monitor resolve "${{ inputs.usuario }}"

      - name: Volcado de la cartera actual
        run: python -m etoro_monitor show "${{ inputs.usuario }}"

      - name: Prueba en crudo (headers y códigos HTTP)
        env:
          USUARIO: ${{ inputs.usuario }}
        run: |
          python - <<'PY'
          import os, requests, json

          usuario = os.environ["USUARIO"]
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36")
          headers = {"User-Agent": UA, "Accept": "application/json, text/plain, */*"}

          def probar(url):
              try:
                  r = requests.get(url, headers=headers, timeout=30)
                  print(f"HTTP {r.status_code}  {r.headers.get('content-type')}  "
                        f"{url}")
                  print("   ", r.text[:300].replace("\n", " "))
              except Exception as exc:
                  print(f"ERROR {exc!r}  {url}")

          base = "https://www.etoro.com"
          r = requests.get(f"{base}/api/logininfo/v1.1/users/{usuario}",
                           headers=headers, timeout=30)
          print(f"HTTP {r.status_code}  usuario -> CID")
          cid = r.json().get("realCID") if r.status_code == 200 else None
          if not cid:
              raise SystemExit(f"No he podido resolver el usuario: {r.text[:300]}")

          probar(f"{base}/sapi/trade-data-real/live/public/portfolios?format=json&cid={cid}")
          probar(f"{base}/sapi/trade-data-real/live/public/portfolios/exposure?cid={cid}")
          probar(f"{base}/sapi/trade-data-real/live/public/positions?cid={cid}&instrumentId=1002")
          probar(f"{base}/sapi/instrumentsmetadata/V1.1/instruments/1002")
          PY
