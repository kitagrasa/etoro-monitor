name: Test instrumentos eToro

# Comprueba el catálogo de instrumentos (activos) de eToro.
#   * bulk:   todos los instrumentos de golpe (~10 MB, se cachea)
#   * single: metadatos de un solo instrumento (lo que usa el monitor)
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs separados por comas"
        required: true
        default: "1002,1004,5712,1832"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Consultar instrumentos
        env:
          IDS: ${{ inputs.ids }}
        run: |
          python - <<'PY'
          import os, json, requests

          ids = [int(x) for x in os.environ["IDS"].split(",") if x.strip()]
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/154.0.0.0 Safari/537.36")
          headers = {"User-Agent": UA, "Accept": "application/json, text/plain, */*"}
          base = "https://www.etoro.com"

          # 1) Catálogo completo (bulkNumber=1&totalBulks=1 -> todos)
          url = (f"{base}/sapi/instrumentsmetadata/V1.1/instruments/bulk"
                 "?bulkNumber=1&supportLowTouch=false&totalBulks=1")
          r = requests.get(url, headers=headers, timeout=120)
          print("=" * 80)
          print("BULK:", url)
          print("HTTP:", r.status_code, "| bytes:", len(r.content))
          if r.status_code == 200:
              datos = r.json().get("InstrumentDisplayDatas", [])
              print("instrumentos en el catálogo:", len(datos))
              print("ejemplo:", json.dumps(datos[0], ensure_ascii=False)[:200])

          # 2) Metadatos individuales (los que usa el monitor)
          for instrument_id in ids:
              url = f"{base}/sapi/instrumentsmetadata/V1.1/instruments/{instrument_id}"
              r = requests.get(url, headers=headers, timeout=30)
              if r.status_code == 200:
                  d = r.json().get("InstrumentDisplayData", {})
                  print(f"{instrument_id}: {d.get('InstrumentDisplayName')} "
                        f"({d.get('SymbolFull')}) tipo={d.get('InstrumentTypeID')}")
              else:
                  print(f"{instrument_id}: HTTP {r.status_code} {r.text[:120]}")
          PY
